<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>智能对账 · 完整版百分比计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* 总和卡片 - 可编辑 */
        .total-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 48px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .total-card:active { transform: scale(0.98); }
        .total-label { font-size: 0.8rem; color: rgba(255,255,255,0.7); }
        .total-number { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: white; 
            font-family: monospace;
            background: rgba(255,255,255,0.15);
            display: inline-block;
            padding: 4px 20px;
            border-radius: 60px;
            margin-top: 4px;
        }
        .total-hint {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            margin-top: 6px;
        }

        .history-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .history-item {
            background: rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 0.75rem;
            color: white;
            white-space: nowrap;
        }

        /* 可折叠卡片 */
        .collapsible-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
        }
        .card-title { color: #ffd60a; font-weight: 600; font-size: 1rem; }
        .card-toggle { color: white; font-size: 1.2rem; transition: transform 0.2s; }
        .card-toggle.open { transform: rotate(180deg); }
        .card-content { padding: 16px; border-top: 1px solid rgba(255,255,255,0.1); display: none; }
        .card-content.open { display: block; }

        /* 计算器显示区 - 带实时预览 */
        .calc-display-area {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .calc-expression {
            text-align: right;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            font-family: monospace;
            word-break: break-all;
            min-height: 56px;
            cursor: pointer;
        }
        .calc-preview {
            text-align: right;
            font-size: 0.8rem;
            color: #ffd60a;
            font-family: monospace;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255,255,255,0.2);
        }
        .calc-preview-label { font-size: 0.65rem; color: #aaa; margin-right: 8px; }
        
        /* 计算记录区 - 带清空按钮 */
        .calc-record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-left: 4px;
        }
        .calc-record-title { font-size: 0.7rem; color: #aaa; }
        .clear-record-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 2px 10px;
            border-radius: 20px;
            color: #ff6b6b;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .calc-record {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 8px 10px;
            margin-bottom: 12px;
            max-height: 120px;
            overflow-y: auto;
        }
        .calc-record-item {
            font-size: 0.7rem;
            color: #ccc;
            font-family: monospace;
            padding: 2px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .calc-record-item .result { color: #ffd60a; font-weight: bold; }
        
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 56px;
            padding: 16px 0;
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.05s;
        }
        .calc-btn:active { background: rgba(255, 255, 255, 0.35); transform: scale(0.96); }
        .calc-btn.op { background: #ff9f0a; }
        .calc-btn.clear { background: #ff3b30; }
        .calc-btn.equal { background: #2a6e3a; }
        
        /* 加入按钮单独一行 */
        .add-btn-wrapper {
            margin-top: 12px;
            text-align: center;
        }
        .calc-btn.add-list {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 0;
            font-size: 0.95rem;
            width: 120px;
            margin: 0 auto;
        }

        /* 功能栏 */
        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .action-btn:active { transform: scale(0.96); }
        .action-btn.camera { background: #ff3b30; }
        .action-btn.secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.8);
        }

        .image-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .image-wrapper { position: relative; display: inline-block; width: 100%; }
        #imagePreview { width: 100%; border-radius: 16px; display: block; }
        .number-marker {
            position: absolute;
            background: #ff3b30;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 12px;
            cursor: pointer;
            transform: translate(5px, -50%);
            white-space: nowrap;
        }

        /* 数字列表 */
        .numbers-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .numbers-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .numbers-title { color: #ffd60a; font-weight: 600; }
        .numbers-stats { font-size: 0.7rem; color: #aaa; }
        .numbers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        .number-item {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: grab;
        }
        .number-item input {
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            font-family: monospace;
            width: 85px;
            text-align: center;
        }
        .number-item input:focus { outline: none; border-bottom: 1px solid #007aff; }
        .number-item button { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 1rem; }
        .drag-handle { cursor: grab; color: #aaa; font-size: 0.8rem; }

        /* 百分比区域 */
        .percent-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .percent-total {
            background: #2a6e3a;
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 0.85rem;
            color: white;
            font-weight: bold;
        }
        
        .percent-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .tool-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 8px 14px;
            border-radius: 30px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
        }
        
        .preset-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 12px;
            display: none;
        }
        .preset-panel.open { display: block; }
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .preset-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
        }
        
        /* 百分比列表 - 智能紧凑模式 */
        .percent-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0;
            max-height: 350px;
            overflow-y: auto;
            transition: all 0.2s;
        }
        .percent-list.compact .percent-item {
            padding: 6px 8px;
        }
        .percent-list.compact .percent-bar-container {
            display: none;
        }
        .percent-list.compact .percent-input-group {
            flex: 1;
        }
        
        .percent-item {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 10px 12px;
            transition: all 0.2s;
        }
        .percent-item-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .percent-input-group {
            flex: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 4px 12px;
        }
        .percent-input-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            font-family: monospace;
            text-align: center;
            padding: 8px 0;
        }
        .percent-input-group input:focus { outline: none; }
        .percent-input-group span { color: #aaa; }
        
        .percent-bar-container {
            flex: 3;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .percent-bar {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        .percent-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9f0a, #ffd60a);
            border-radius: 4px;
            width: 0%;
            transition: width 0.2s;
        }
        .percent-bar-value {
            font-size: 0.7rem;
            color: #ffd60a;
            min-width: 45px;
            text-align: right;
        }
        
        .percent-actions {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            color: #aaa;
        }
        .icon-btn.locked { color: #ff3b30; }
        
        .add-percent {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .add-percent input {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
        }
        .add-percent button {
            background: #ff9f0a;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .percent-result {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 12px;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #ddd;
            max-height: 120px;
            overflow-y: auto;
        }
        .percent-result span { color: #ffd60a; font-weight: bold; }

        .status-text { text-align: center; padding: 12px; color: #ffd60a; font-size: 0.8rem; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 100;
            animation: fadeOut 2s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="history-bar" id="historyBar"></div>

    <!-- 总和卡片 - 支持直接修改 -->
    <div class="total-card" id="totalCard">
        <div class="total-label">💰 当前总和</div>
        <div class="total-number" id="totalAmount">0.00</div>
        <div class="total-hint">👇 点击数字可直接修改</div>
    </div>

    <!-- 可折叠计算器 -->
    <div class="collapsible-card" id="calcCard">
        <div class="card-header" id="calcHeader">
            <div class="card-title">🧮 计算器（实时预览）</div>
            <div class="card-toggle">▼</div>
        </div>
        <div class="card-content" id="calcContent">
            <div class="calc-display-area">
                <div class="calc-expression" id="calcExpression" onclick="editExpression()">0</div>
                <div class="calc-preview">
                    <span class="calc-preview-label">📐 实时预览：</span>
                    <span id="calcPreview">0</span>
                </div>
            </div>
            
            <!-- 计算记录区 - 带清空按钮 -->
            <div class="calc-record">
                <div class="calc-record-header">
                    <div class="calc-record-title">📋 计算记录</div>
                    <button class="clear-record-btn" id="clearRecordBtn">清空记录</button>
                </div>
                <div id="calcRecordList">暂无记录</div>
            </div>
            
            <div class="calc-buttons">
                <button class="calc-btn clear" id="calcClear">C</button>
                <button class="calc-btn" id="calcBack">⌫</button>
                <button class="calc-btn op" data-op="÷">÷</button>
                <button class="calc-btn op" data-op="×">×</button>

                <button class="calc-btn" data-num="7">7</button>
                <button class="calc-btn" data-num="8">8</button>
                <button class="calc-btn" data-num="9">9</button>
                <button class="calc-btn op" data-op="-">-</button>

                <button class="calc-btn" data-num="4">4</button>
                <button class="calc-btn" data-num="5">5</button>
                <button class="calc-btn" data-num="6">6</button>
                <button class="calc-btn op" data-op="+">+</button>

                <button class="calc-btn" data-num="1">1</button>
                <button class="calc-btn" data-num="2">2</button>
                <button class="calc-btn" data-num="3">3</button>
                <button class="calc-btn equal" id="calcEqual">=</button>

                <button class="calc-btn" data-num="0">0</button>
                <button class="calc-btn" data-num="00">00</button>
                <button class="calc-btn" data-num=".">.</button>
            </div>
            
            <div class="add-btn-wrapper">
                <button class="calc-btn add-list" id="addToListBtn">📋 加入列表</button>
            </div>
        </div>
    </div>

    <!-- 功能栏 -->
    <div class="action-bar">
        <button class="action-btn camera" id="takePhotoBtn">📷 拍照</button>
        <button class="action-btn secondary" id="selectImageBtn">📁 选图</button>
        <button class="action-btn secondary" id="exportBtn">📎 复制结果</button>
        <button class="action-btn secondary" id="clearAllDataBtn">🗑️ 清空所有</button>
    </div>

    <div class="image-container" id="imageContainer">
        <div class="image-wrapper" id="imageWrapper">
            <img id="imagePreview" alt="预览">
        </div>
        <div class="status-text" id="imageHint">💡 点击红色数字可修改</div>
    </div>

    <!-- 数字列表 -->
    <div class="numbers-card">
        <div class="numbers-header">
            <div class="numbers-title">📝 数字列表（拖动排序）</div>
            <div class="numbers-stats" id="numbersStats">0项</div>
        </div>
        <div class="numbers-list" id="numbersList"></div>
    </div>

    <!-- 百分比卡片 -->
    <div class="collapsible-card" id="percentCard">
        <div class="card-header" id="percentHeader">
            <div class="card-title">📊 百分比计算器（可修改总和）</div>
            <div class="card-toggle">▼</div>
        </div>
        <div class="card-content" id="percentContent">
            <div class="percent-header-row">
                <div class="percent-title">百分比列表</div>
                <div class="percent-total" id="percentTotal">合计: 0%</div>
            </div>
            
            <!-- 直接修改总和的快捷入口 -->
            <div class="add-percent" style="margin-bottom: 12px; background: rgba(0,0,0,0.3); border-radius: 40px;">
                <input type="number" id="directTotalInput" placeholder="直接输入总和" step="any" style="background: rgba(255,255,255,0.9);">
                <button id="setTotalBtn" style="background: #007aff;">设置总和</button>
            </div>
            
            <div class="percent-toolbar">
                <button class="tool-btn" id="balanceBtn">⚖️ 自动平衡</button>
                <button class="tool-btn" id="savePresetBtn">💾 保存配置</button>
                <button class="tool-btn" id="loadPresetBtn">📂 加载配置</button>
                <button class="tool-btn" id="resetPercentBtn">🔄 重置默认</button>
            </div>
            
            <div class="preset-panel" id="presetPanel">
                <div style="font-size:0.7rem; color:#aaa;">已保存的配置</div>
                <div class="preset-buttons" id="presetButtons"></div>
            </div>
            
            <div class="percent-list" id="percentList"></div>
            
            <div class="add-percent">
                <input type="number" id="newPercent" placeholder="输入百分比" step="any">
                <button id="addPercentBtn">+ 添加</button>
            </div>
            
            <div class="percent-result" id="percentResult">💡 添加百分比</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
    // ========== 数据 ==========
    let numbers = [];
    let percentages = [];
    let percentLocks = [];
    let markers = [];
    let history = [];
    let calcRecords = [];
    let savedPresets = [];

    // ========== 计算器相关 ==========
    let currentExpression = "0";
    let lastCharIsOperator = false;
    let lastCharIsDecimal = false;
    let calcOpen = false;
    let percentOpen = false;

    // 本地存储
    const STORAGE_PERCENT = 'saved_percentages';
    const STORAGE_PERCENT_LOCKS = 'percent_locks';
    const STORAGE_PRESETS = 'percent_presets';
    const STORAGE_HISTORY = 'calc_history';
    const STORAGE_CALC_RECORDS = 'calc_records';

    // DOM
    const totalSpan = document.getElementById('totalAmount');
    const calcExpressionSpan = document.getElementById('calcExpression');
    const calcPreviewSpan = document.getElementById('calcPreview');
    const calcRecordList = document.getElementById('calcRecordList');
    const numbersListDiv = document.getElementById('numbersList');
    const numbersStats = document.getElementById('numbersStats');
    const percentListDiv = document.getElementById('percentList');
    const percentResultSpan = document.getElementById('percentResult');
    const percentTotalSpan = document.getElementById('percentTotal');
    const historyBar = document.getElementById('historyBar');
    const presetPanel = document.getElementById('presetPanel');
    const presetButtonsDiv = document.getElementById('presetButtons');
    const directTotalInput = document.getElementById('directTotalInput');
    const setTotalBtn = document.getElementById('setTotalBtn');

    // ========== 安全计算 ==========
    function safeEvaluate(expression) {
        if (!expression || expression === '') return null;
        let calcExpr = expression.replace(/×/g, '*').replace(/÷/g, '/');
        if (/[+\-*/]$/.test(calcExpr)) calcExpr = calcExpr.slice(0, -1);
        if (calcExpr === '') return null;
        try {
            let result = Function('"use strict";return (' + calcExpr + ')')();
            if (isNaN(result) || !isFinite(result)) return null;
            return parseFloat(result.toFixed(10)).toString();
        } catch(e) { return null; }
    }

    function updatePreview() {
        let preview = safeEvaluate(currentExpression);
        calcPreviewSpan.innerText = preview !== null ? preview : '?';
    }

    function updateExpressionDisplay() {
        calcExpressionSpan.innerText = currentExpression || '0';
        updatePreview();
    }

    // ========== 总和相关 ==========
    function getTotal() { return numbers.reduce((s, n) => s + n, 0); }
    function formatNum(n) { return parseFloat(n).toFixed(2); }
    
    function updateTotal() {
        let total = getTotal();
        totalSpan.innerText = formatNum(total);
        numbersStats.innerText = `${numbers.length}项 = ${formatNum(total)}`;
        updatePercentResult();
    }
    
    // 直接设置总和（按比例调整所有数字）
    function setTotalDirectly(newTotal) {
        let oldTotal = getTotal();
        if (oldTotal === 0 || numbers.length === 0) {
            numbers.push(newTotal);
            updateNumbersList();
            updateTotal();
            updatePercentResult();
            showToast(`✅ 总和已设置为 ${formatNum(newTotal)}`);
        } else {
            let ratio = newTotal / oldTotal;
            numbers = numbers.map(n => n * ratio);
            updateNumbersList();
            updateTotal();
            updatePercentResult();
            showToast(`✅ 总和已修改为 ${formatNum(newTotal)}`);
        }
    }

    // ========== 计算记录管理 ==========
    function addCalcRecord(expression, result) {
        calcRecords.unshift({ expression, result, time: new Date().toLocaleTimeString() });
        if (calcRecords.length > 50) calcRecords.pop();
        localStorage.setItem(STORAGE_CALC_RECORDS, JSON.stringify(calcRecords));
        updateCalcRecordDisplay();
    }
    
    function clearCalcRecords() {
        if (calcRecords.length === 0) {
            showToast('暂无计算记录');
            return;
        }
        if (confirm('清空所有计算记录？')) {
            calcRecords = [];
            localStorage.setItem(STORAGE_CALC_RECORDS, JSON.stringify(calcRecords));
            updateCalcRecordDisplay();
            showToast('✅ 已清空计算记录');
        }
    }
    
    function updateCalcRecordDisplay() {
        if (calcRecords.length === 0) {
            calcRecordList.innerHTML = '<div style="color:#666; text-align:center; padding:8px;">暂无计算记录</div>';
            return;
        }
        let html = '';
        calcRecords.slice(0, 20).forEach(record => {
            html += `<div class="calc-record-item">${record.expression} = <span class="result">${record.result}</span></div>`;
        });
        calcRecordList.innerHTML = html;
    }

    // ========== 百分比核心功能 ==========
    function loadPercentages() {
        let saved = localStorage.getItem(STORAGE_PERCENT);
        if (saved) {
            try { percentages = JSON.parse(saved); } catch(e) {}
        }
        if (!percentages || percentages.length === 0) percentages = [5, 10, 15];
        
        let savedLocks = localStorage.getItem(STORAGE_PERCENT_LOCKS);
        if (savedLocks) {
            try { percentLocks = JSON.parse(savedLocks); } catch(e) {}
        }
        while (percentLocks.length < percentages.length) percentLocks.push(false);
        while (percentLocks.length > percentages.length) percentLocks.pop();
    }
    
    function savePercentages() {
        localStorage.setItem(STORAGE_PERCENT, JSON.stringify(percentages));
        localStorage.setItem(STORAGE_PERCENT_LOCKS, JSON.stringify(percentLocks));
    }
    
    function updatePercentTotal() {
        let sum = percentages.reduce((s, p) => s + p, 0);
        percentTotalSpan.innerText = `合计: ${sum.toFixed(2)}%`;
        if (Math.abs(sum - 100) < 0.01) {
            percentTotalSpan.style.background = "#2a6e3a";
        } else if (sum > 100) {
            percentTotalSpan.style.background = "#ff3b30";
        } else {
            percentTotalSpan.style.background = "#ff9f0a";
        }
    }
    
    function updateCompactMode() {
        const percentList = document.getElementById('percentList');
        if (!percentList) return;
        if (percentages.length > 5) {
            percentList.classList.add('compact');
        } else {
            percentList.classList.remove('compact');
        }
    }
    
    function renderPercentList() {
        if (percentages.length === 0) {
            percentListDiv.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px;">暂无百分比，点击 + 添加</div>';
            updatePercentTotal();
            updateCompactMode();
            return;
        }
        
        let total = percentages.reduce((s, p) => s + p, 0);
        let isCompact = percentages.length > 5;
        let html = '';
        
        percentages.forEach((p, i) => {
            let ratio = total > 0 ? (p / total * 100) : 0;
            html += `
                <div class="percent-item" data-index="${i}">
                    <div class="percent-item-row">
                        <div class="percent-input-group">
                            <input type="number" class="edit-percent" data-index="${i}" value="${p}" step="any" style="min-width:70px;">
                            <span>%</span>
                        </div>
                        ${!isCompact ? `
                        <div class="percent-bar-container">
                            <div class="percent-bar">
                                <div class="percent-bar-fill" style="width: ${ratio}%;"></div>
                            </div>
                            <span class="percent-bar-value">${ratio.toFixed(1)}%</span>
                        </div>
                        ` : ''}
                        <div class="percent-actions">
                            <button class="icon-btn lock-btn" data-index="${i}">${percentLocks[i] ? '🔒' : '🔓'}</button>
                            <button class="icon-btn delete-percent" data-index="${i}">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        });
        
        percentListDiv.innerHTML = html;
        updatePercentTotal();
        updateCompactMode();
        
        document.querySelectorAll('.edit-percent').forEach(input => {
            input.addEventListener('change', (e) => {
                let idx = parseInt(e.target.dataset.index);
                let newVal = parseFloat(e.target.value);
                if (!isNaN(newVal) && newVal > 0) {
                    if (percentLocks[idx]) {
                        showToast('🔒 此项已锁定，请先解锁');
                        e.target.value = percentages[idx];
                        return;
                    }
                    percentages[idx] = newVal;
                    savePercentages();
                    renderPercentList();
                    updatePercentResult();
                } else {
                    showToast('请输入正数');
                    e.target.value = percentages[idx];
                }
            });
        });
        
        document.querySelectorAll('.lock-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let idx = parseInt(btn.dataset.index);
                percentLocks[idx] = !percentLocks[idx];
                savePercentages();
                renderPercentList();
                showToast(percentLocks[idx] ? '🔒 已锁定' : '🔓 已解锁');
            });
        });
        
        document.querySelectorAll('.delete-percent').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let idx = parseInt(btn.dataset.index);
                percentages.splice(idx, 1);
                percentLocks.splice(idx, 1);
                savePercentages();
                renderPercentList();
                updatePercentResult();
                showToast('已删除');
            });
        });
        
        updatePercentResult();
    }
    
    function autoBalance() {
        let lockedSum = 0;
        let unlockedIndices = [];
        percentages.forEach((p, i) => {
            if (percentLocks[i]) {
                lockedSum += p;
            } else {
                unlockedIndices.push(i);
            }
        });
        if (unlockedIndices.length === 0) {
            showToast('所有项都已锁定，无法平衡');
            return;
        }
        let remaining = 100 - lockedSum;
        if (remaining < 0) {
            showToast(`锁定的项合计已达 ${lockedSum.toFixed(2)}%，超过100%，请先解锁部分项`);
            return;
        }
        let avg = remaining / unlockedIndices.length;
        for (let idx of unlockedIndices) {
            percentages[idx] = parseFloat(avg.toFixed(2));
        }
        savePercentages();
        renderPercentList();
        updatePercentResult();
        showToast(`✅ 已平衡，未锁定项平均分配为 ${avg.toFixed(2)}%`);
    }
    
    function savePreset() {
        let name = prompt('输入配置名称', `配置${savedPresets.length + 1}`);
        if (!name) return;
        savedPresets.push({ name, percentages: [...percentages], locks: [...percentLocks] });
        if (savedPresets.length > 10) savedPresets.shift();
        localStorage.setItem(STORAGE_PRESETS, JSON.stringify(savedPresets));
        showToast(`✅ 已保存: ${name}`);
        updatePresetButtons();
    }
    
    function loadPreset(index) {
        let preset = savedPresets[index];
        if (preset) {
            percentages = [...preset.percentages];
            percentLocks = [...preset.locks];
            savePercentages();
            renderPercentList();
            updatePercentResult();
            showToast(`📂 已加载: ${preset.name}`);
        }
    }
    
    function updatePresetButtons() {
        if (savedPresets.length === 0) {
            presetButtonsDiv.innerHTML = '<div style="color:#aaa;">暂无保存的配置</div>';
            return;
        }
        let html = '';
        savedPresets.forEach((preset, i) => {
            html += `<button class="preset-btn" data-preset="${i}">📁 ${preset.name}</button>`;
        });
        presetButtonsDiv.innerHTML = html;
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => loadPreset(parseInt(btn.dataset.preset)));
        });
    }
    
    function loadPresets() {
        let saved = localStorage.getItem(STORAGE_PRESETS);
        if (saved) {
            try { savedPresets = JSON.parse(saved); } catch(e) {}
        }
        updatePresetButtons();
    }
    
    function addPercent() {
        let input = document.getElementById('newPercent');
        let val = parseFloat(input.value);
        if (isNaN(val)) { showToast('请输入数字'); return; }
        if (val <= 0) { showToast('请输入正数'); return; }
        percentages.push(val);
        percentLocks.push(false);
        savePercentages();
        renderPercentList();
        updatePercentResult();
        showToast(`✅ 已添加 ${val}%`);
        input.value = '';
    }
    
    function resetPercentages() {
        percentages = [5, 10, 15];
        percentLocks = [false, false, false];
        savePercentages();
        renderPercentList();
        updatePercentResult();
        showToast('已重置为 5%, 10%, 15%');
    }
    
    function updatePercentResult() {
        let total = getTotal();
        if (total === 0) {
            percentResultSpan.innerHTML = '📊 暂无总和，请在下方直接输入总和或添加数字';
            return;
        }
        if (percentages.length === 0) {
            percentResultSpan.innerHTML = `💰 ${formatNum(total)}<br>📊 添加百分比`;
            return;
        }
        let html = `<strong>💰 ${formatNum(total)}</strong><br>`;
        percentages.forEach((p, idx) => {
            let value = total * p / 100;
            html += ` ${p}% = <span>${formatNum(value)}</span>  `;
            if ((idx + 1) % 4 === 0) html += '<br>';
        });
        percentResultSpan.innerHTML = html;
    }
    
    function togglePresetPanel() {
        if (presetPanel.classList.contains('open')) {
            presetPanel.classList.remove('open');
        } else {
            presetPanel.classList.add('open');
            updatePresetButtons();
        }
    }

    // ========== 计算器函数 ==========
    window.editExpression = function() {
        let newVal = prompt('编辑算式', currentExpression);
        if (newVal !== null && newVal !== '') {
            currentExpression = newVal;
            let lastChar = currentExpression[currentExpression.length - 1];
            lastCharIsOperator = ['+', '-', '×', '÷'].includes(lastChar);
            lastCharIsDecimal = lastChar === '.';
            updateExpressionDisplay();
        }
    };
    
    function inputDigit(d) {
        if (currentExpression === '0' && !lastCharIsOperator) currentExpression = d;
        else currentExpression += d;
        lastCharIsOperator = false; lastCharIsDecimal = false;
        updateExpressionDisplay();
    }
    function inputDecimal() {
        if (lastCharIsOperator) currentExpression += '0.';
        else if (!lastCharIsDecimal) currentExpression += '.';
        else return;
        lastCharIsOperator = false; lastCharIsDecimal = true;
        updateExpressionDisplay();
    }
    function inputOperator(op) {
        if (lastCharIsOperator) currentExpression = currentExpression.slice(0, -1) + op;
        else if (currentExpression === '') currentExpression = '0' + op;
        else currentExpression += op;
        lastCharIsOperator = true; lastCharIsDecimal = false;
        updateExpressionDisplay();
    }
    function clearExpression() { currentExpression = '0'; lastCharIsOperator = false; lastCharIsDecimal = false; updateExpressionDisplay(); }
    function backspace() {
        if (currentExpression.length > 1) {
            currentExpression = currentExpression.slice(0, -1);
            let lastChar = currentExpression[currentExpression.length - 1];
            lastCharIsOperator = ['+', '-', '×', '÷'].includes(lastChar);
            lastCharIsDecimal = lastChar === '.';
        } else { currentExpression = '0'; lastCharIsOperator = false; lastCharIsDecimal = false; }
        updateExpressionDisplay();
    }
    function calculateAndRecord() {
        if (currentExpression === '' || lastCharIsOperator) { showToast('算式不完整'); return; }
        let result = safeEvaluate(currentExpression);
        if (result === null) { showToast('算式无效'); return; }
        addCalcRecord(currentExpression, result);
        currentExpression = result;
        lastCharIsOperator = false;
        lastCharIsDecimal = result.includes('.');
        updateExpressionDisplay();
        showToast(`✅ 计算结果: ${result}`);
    }
    function getCurrentValue() {
        if (currentExpression === '' || lastCharIsOperator) return 0;
        let result = safeEvaluate(currentExpression);
        return result !== null ? parseFloat(result) : 0;
    }
    
    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    function updateNumbersList() {
        if (numbers.length === 0) {
            numbersListDiv.innerHTML = '<div style="color:#aaa;">暂无数字，请拍照或计算器添加</div>';
            return;
        }
        let html = '';
        numbers.forEach((n, i) => {
            html += `<div class="number-item" draggable="true" data-index="${i}"><span class="drag-handle">⋮⋮</span><input type="number" class="edit-number" data-index="${i}" value="${n}" step="any"><button class="delete-number" data-index="${i}">✕</button></div>`;
        });
        numbersListDiv.innerHTML = html;
        document.querySelectorAll('.edit-number').forEach(input => {
            input.addEventListener('change', (e) => {
                let idx = parseInt(e.target.dataset.index);
                let newVal = parseFloat(e.target.value);
                if (!isNaN(newVal)) { numbers[idx] = newVal; updateTotal(); updateNumbersList(); updateMarkersDisplay(); }
            });
        });
        document.querySelectorAll('.delete-number').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let idx = parseInt(btn.dataset.index);
                numbers.splice(idx, 1);
                if (markers[idx]) markers.splice(idx, 1);
                updateTotal(); updateNumbersList(); updateMarkersDisplay();
            });
        });
        updateTotal();
    }
    
    function addNumber(num) {
        let n = parseFloat(num);
        if (!isNaN(n) && isFinite(n)) { numbers.push(n); updateNumbersList(); updateTotal(); updatePercentResult(); showToast(`✅ 已添加 ${formatNum(n)}`); return true; }
        return false;
    }
    
    function initCollapsible() {
        const calcCard = document.getElementById('calcCard'), calcHeader = document.getElementById('calcHeader'), calcContent = document.getElementById('calcContent');
        const percentCard = document.getElementById('percentCard'), percentHeader = document.getElementById('percentHeader'), percentContent = document.getElementById('percentContent');
        calcHeader.addEventListener('click', () => { calcOpen = !calcOpen; if (calcOpen) { calcContent.classList.add('open'); calcHeader.querySelector('.card-toggle').classList.add('open'); } else { calcContent.classList.remove('open'); calcHeader.querySelector('.card-toggle').classList.remove('open'); } });
        percentHeader.addEventListener('click', () => { percentOpen = !percentOpen; if (percentOpen) { percentContent.classList.add('open'); percentHeader.querySelector('.card-toggle').classList.add('open'); } else { percentContent.classList.remove('open'); percentHeader.querySelector('.card-toggle').classList.remove('open'); } });
    }
    
    // 清空所有数据（数字列表 + 计算记录 + 历史记录）
    function clearAllData() {
        if (confirm('⚠️ 清空所有数据？\n\n这将清空：\n• 数字列表\n• 计算记录\n• 历史记录\n\n百分比配置不会清除。')) {
            numbers = [];
            markers = [];
            calcRecords = [];
            history = [];
            localStorage.setItem(STORAGE_CALC_RECORDS, JSON.stringify(calcRecords));
            localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));
            updateNumbersList();
            updateCalcRecordDisplay();
            updateHistoryDisplay();
            updateMarkersDisplay();
            showToast('✅ 已清空所有数据');
        }
    }
    
    // 历史记录
    function saveHistory() { localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history.slice(0, 5))); }
    function loadHistory() {
        let saved = localStorage.getItem(STORAGE_HISTORY);
        if (saved) { try { history = JSON.parse(saved); } catch(e) {} }
        updateHistoryDisplay();
    }
    function addToHistory(total) {
        let time = new Date().toLocaleTimeString();
        history.unshift({time, total});
        if (history.length > 5) history.pop();
        saveHistory();
        updateHistoryDisplay();
    }
    function updateHistoryDisplay() {
        if (history.length === 0) { historyBar.innerHTML = '<div class="history-item">暂无历史</div>'; return; }
        let html = '';
        history.forEach(h => { html += `<div class="history-item">💰 ${h.total} (${h.time})</div>`; });
        historyBar.innerHTML = html;
    }
    
    // 拍照识别
    async function recognizeImage(file) {
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            imagePreview.src = e.target.result;
            imageContainer.style.display = 'block';
            imagePreview.onload = () => {
                imagePreview.style.cursor = 'crosshair';
                imagePreview.onclick = (e) => {
                    let rect = imagePreview.getBoundingClientRect();
                    let x = (e.clientX - rect.left) / rect.width * 100;
                    let y = (e.clientY - rect.top) / rect.height * 100;
                    let val = prompt('输入数字', '0');
                    if (val && !isNaN(parseFloat(val))) {
                        numbers.push(parseFloat(val));
                        markers.push({x, y});
                        updateNumbersList();
                        updateMarkersDisplay();
                        showToast(`✅ 添加 ${val}`);
                    }
                };
            };
        };
        reader.readAsDataURL(file);
        imageHint.innerHTML = '🔄 识别中... <span class="loading"></span>';
        try {
            const result = await Tesseract.recognize(file, 'chi_sim+eng', {
                logger: (m) => { if (m.status === 'recognizing text') imageHint.innerHTML = `🔄 ${Math.round(m.progress * 100)}%`; }
            });
            let extracted = [];
            for (let word of result.data.words) {
                let num = parseFloat(word.text);
                if (!isNaN(num) && num > 0 && num < 100000) {
                    let bbox = word.bbox;
                    let x = (bbox.x0 + bbox.x1) / 2 / imagePreview.naturalWidth * 100;
                    let y = (bbox.y0 + bbox.y1) / 2 / imagePreview.naturalHeight * 100;
                    extracted.push({value: num, x, y});
                }
            }
            if (extracted.length > 0) {
                numbers.push(...extracted.map(e => e.value));
                markers.push(...extracted.map(e => ({x: e.x, y: e.y})));
                updateNumbersList();
                updateMarkersDisplay();
                imageHint.innerHTML = `✅ 识别到 ${extracted.length} 个数字`;
            } else { imageHint.innerHTML = '❌ 未识别到数字'; }
        } catch(e) { imageHint.innerHTML = '❌ 识别失败'; }
    }
    
    function updateMarkersDisplay() {
        document.querySelectorAll('.number-marker').forEach(m => m.remove());
        if (!markers.length || !numbers.length) return;
        markers.forEach((m, idx) => {
            if (idx >= numbers.length) return;
            let div = document.createElement('div');
            div.className = 'number-marker';
            div.textContent = numbers[idx].toFixed(2);
            div.style.left = `${m.x + 3}%`;
            div.style.top = `${m.y - 2}%`;
            div.onclick = () => {
                let val = prompt('修改数字', numbers[idx]);
                if (val && !isNaN(parseFloat(val))) {
                    numbers[idx] = parseFloat(val);
                    updateNumbersList();
                    updateMarkersDisplay();
                    showToast('已修改');
                }
            };
            imageWrapper.appendChild(div);
        });
    }
    
    function takePhoto() {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = (e) => { if (e.target.files[0]) recognizeImage(e.target.files[0]); };
        input.click();
    }
    
    function selectImage() {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => { if (e.target.files[0]) recognizeImage(e.target.files[0]); };
        input.click();
    }
    
    function exportResult() {
        let total = getTotal();
        let text = `💰 总和: ${formatNum(total)}\n📝 明细: ${numbers.map(n => formatNum(n)).join(', ')}\n\n📊 百分比: ${percentages.join('%, ')}% = 合计 ${percentages.reduce((s,p)=>s+p,0)}%\n`;
        percentages.forEach(p => { text += `  ${p}% = ${formatNum(total * p / 100)}\n`; });
        if (calcRecords.length > 0) {
            text += `\n📋 计算记录:\n`;
            calcRecords.slice(0, 10).forEach(record => {
                text += `  ${record.expression} = ${record.result}\n`;
            });
        }
        navigator.clipboard.writeText(text);
        showToast('✅ 已复制到剪贴板');
        addToHistory(formatNum(total));
    }
    
    // 事件绑定
    document.querySelectorAll('.calc-btn[data-num]').forEach(btn => btn.addEventListener('click', () => { if (btn.dataset.num === '.') inputDecimal(); else inputDigit(btn.dataset.num); }));
    document.querySelectorAll('.calc-btn[data-op]').forEach(btn => btn.addEventListener('click', () => inputOperator(btn.dataset.op)));
    document.getElementById('calcClear').addEventListener('click', clearExpression);
    document.getElementById('calcBack').addEventListener('click', backspace);
    document.getElementById('calcEqual').addEventListener('click', calculateAndRecord);
    document.getElementById('addToListBtn').addEventListener('click', () => addNumber(getCurrentValue()));
    document.getElementById('takePhotoBtn').addEventListener('click', takePhoto);
    document.getElementById('selectImageBtn').addEventListener('click', selectImage);
    document.getElementById('exportBtn').addEventListener('click', exportResult);
    document.getElementById('clearAllDataBtn').addEventListener('click', clearAllData);
    document.getElementById('clearRecordBtn').addEventListener('click', clearCalcRecords);
    document.getElementById('addPercentBtn').addEventListener('click', addPercent);
    document.getElementById('balanceBtn').addEventListener('click', autoBalance);
    document.getElementById('savePresetBtn').addEventListener('click', savePreset);
    document.getElementById('loadPresetBtn').addEventListener('click', togglePresetPanel);
    document.getElementById('resetPercentBtn').addEventListener('click', resetPercentages);
    
    // 总和直接修改
    document.getElementById('totalCard').addEventListener('click', () => {
        let newVal = prompt('修改总和', getTotal());
        if (newVal && !isNaN(parseFloat(newVal))) {
            setTotalDirectly(parseFloat(newVal));
        }
    });
    setTotalBtn.addEventListener('click', () => {
        let val = parseFloat(directTotalInput.value);
        if (!isNaN(val) && val > 0) {
            setTotalDirectly(val);
            directTotalInput.value = '';
        } else {
            showToast('请输入有效数字');
        }
    });
    
    // 初始化
    loadPercentages();
    loadPresets();
    loadHistory();
    renderPercentList();
    updateNumbersList();
    updateExpressionDisplay();
    updateCalcRecordDisplay();
    initCollapsible();
</script>
</body>
